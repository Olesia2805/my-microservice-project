apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
spec:
  destination:
    name: in-cluster
    namespace: django
  project: default
  source:
    repoURL: 'https://github.com/Olesia2805/my-microservice-project.git'
    path: charts/django-app
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
