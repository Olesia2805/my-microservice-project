controller:
  serviceType: LoadBalancer

  admin:
    username: admin
    password: admin

  resources:
    limits:
      cpu: "500m"
      memory: "1024Mi"
    requests:
      cpu: "200m"
      memory: "512Mi"

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest

persistence:
  enabled: true
  size: 20Gi
  storageClass: "gp2"
