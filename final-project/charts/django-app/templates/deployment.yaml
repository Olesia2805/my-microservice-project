apiVersion: apps/v1
kind: Deployment
metadata:
  name: lesson-8-9-django
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lesson-8-9-django
  template:
    metadata:
      labels:
        app: lesson-8-9-django
    spec:
      serviceAccountName: ecr-access
      containers:
        - name: django
          image: 139144002561.dkr.ecr.us-east-1.amazonaws.com/lesson-8-9-ecr:latest
          ports:
            - containerPort: 8000
